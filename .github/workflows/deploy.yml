name: Deploy to Firebase

permissions:
  contents: read

concurrency:
  group: firebase-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: functions/package-lock.json
    
    - name: Install dependencies
      run: |
        cd functions
        npm ci
    
    - name: Run regression tests
      run: |
        cd functions
        npm test

    - name: Set up Java for Firestore emulator
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Test Firestore security and backend integration
      run: npx firebase-tools@15.34.2 emulators:exec --only firestore --project demo-document-breaker "node --test --test-concurrency=1 tests/backend-emulator.test.js tests/firestore-rules.test.js"
    
    - name: Deploy to Firebase
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        npx firebase-tools@15.34.2 deploy --only functions,firestore:rules,hosting --force
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        CI: true
    
    - name: Deploy status
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "🚀 Deploy successful!"
    
    - name: Deploy failed
      if: failure()
      run: echo "❌ Deploy failed!"
